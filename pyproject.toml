[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-shorts-generator"
version = "0.2.0"
description = "Automated AI-powered YouTube Shorts & TikTok video generation pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "atillacam", email = "candan58@outlook.com" }
]
keywords = [
  "youtube-shorts",
  "tiktok",
  "ai",
  "gemini",
  "edge-tts",
  "moviepy",
  "video-generator",
  "automation"
]
dependencies = [
  "google-generativeai",
  "google-genai",
  "python-dotenv",
  "edge-tts",
  "moviepy",
  "requests"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.1.0",
  "mypy>=1.0"
]

[project.scripts]
youtube-shorts = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "src.shorts_generator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

